global
    log stdout format raw local0
    maxconn 50000
    nbthread 4

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

# ── Stats dashboard (http://<haproxy-server>:8404/) ──────────────────────────
# Restrict port 8404 via firewall — allow only trusted IPs
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats show-node
    stats show-legends
    stats auth admin:${STATS_PASSWORD}

# ── VLESS WS TLS — 443 ───────────────────────────────────────────────────────
frontend fe_443
    bind *:443
    default_backend be_443

backend be_443
    balance leastconn
    option tcp-check
    server node1 ${NODE_1_IP}:443 check inter 5s fall 3 rise 2
    server node2 ${NODE_2_IP}:443 check inter 5s fall 3 rise 2
    # server node3 ${NODE_3_IP}:443 check inter 5s fall 3 rise 2

