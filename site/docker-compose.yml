services:
  backend:
    build: ./backend
    container_name: vpn-backend
    restart: always
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data
    expose:
      - "3001"

  frontend:
    build: ./frontend
    container_name: vpn-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
